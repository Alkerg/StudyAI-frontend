<drop-file-zone (filesSelected)="onFilesSelected($event)"></drop-file-zone>

<div class="w-3/4 mx-auto">

    @if(filesUploaded().length === 0){
        <div class="flex border border-gray-400 text-gray-500 rounded h-15 items-center justify-center mb-2">
            <h3 class="px-4">No files uploaded</h3>

        </div>
    }

    @for(file of filesUploaded(); track $index){
        <file-box (fileNameOutput)="deleteFileAndSummary($event)" [fileName]="file.name" [fileSize]="file.size/(1024*1024)"></file-box>
    }

    <div (click)="sendFilesToSummarize(filesUploaded())" class="flex justify-center mt-4">
        <button class="bg-green-500 text-white rounded py-3 px-4 mx-auto hover:cursor-pointer hover:bg-green-700">
            Summarize
        </button>
    </div>

    @if(loadingData()){
        <div>
            <div class="flex justify-center items-center h-32">
                <svg class="animate-spin h-10 w-10 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    }@else if(summarizeReady()){
        @for(item of summaries(); track item.id){
            <article class="border bg-gray-100 rounded mt-5 mb-5">
                <div class="flex justify-between items-center py-4 border-b">
                    <h2 class="font-bold px-4">{{item.fileName}}</h2>
                    <div class="flex gap-2 px-4">
                        <button class="bg-white p-2 rounded hover:bg-gray-300 hover:cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                    <path d="M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.242a2 2 0 0 0-.602-1.43L16.083 2.57A2 2 0 0 0 14.685 2H10a2 2 0 0 0-2 2" />
                                    <path d="M16 18v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2" />
                                </g>
                            </svg>

                        </button>
                        <button class="bg-white p-2 rounded hover:bg-gray-300 hover:cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
                                <path d="M0 0h24v24H0z" fill="none" />
                                <path fill="#000" fill-rule="evenodd" d="M5 16.25a.75.75 0 0 1 .75.75v2c0 .138.112.25.25.25h12a.25.25 0 0 0 .25-.25v-2a.75.75 0 0 1 1.5 0v2A1.75 1.75 0 0 1 18 20.75H6A1.75 1.75 0 0 1 4.25 19v-2a.75.75 0 0 1 .75-.75" clip-rule="evenodd" />
                                <path fill="#000" d="M10.738 3.75a.99.99 0 0 0-.988.906a37 37 0 0 0-.082 5.27q-.37.02-.74.047l-1.49.109a.76.76 0 0 0-.585 1.167a15.6 15.6 0 0 0 4.032 4.258l.597.429a.89.89 0 0 0 1.036 0l.597-.429a15.6 15.6 0 0 0 4.032-4.258a.76.76 0 0 0-.585-1.167l-1.49-.109a42 42 0 0 0-.74-.047a37 37 0 0 0-.081-5.27a.99.99 0 0 0-.989-.906z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="m-6">
                    <markdown class="prose" [data]="item.summary"></markdown>
                </div>
                
            </article>
        }
    }

</div>



<health-checker></health-checker>
